<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1F1B2E"/>
      <stop offset="100%" stop-color="#0A0A0F"/>
    </radialGradient>
    <linearGradient id="stoneBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="stoneMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="stoneTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="apple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="dumbbell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="drop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Lune douce en arrière-plan -->
  <circle cx="800" cy="240" r="70" fill="#FEF3C7" opacity="0.12"/>
  <circle cx="800" cy="240" r="55" fill="#FEF3C7" opacity="0.08"/>

  <!-- Étoiles décoratives -->
  <circle cx="180" cy="200" r="4" fill="#FB923C" opacity="0.7"/>
  <circle cx="160" cy="380" r="3" fill="#FB923C" opacity="0.5"/>
  <circle cx="900" cy="500" r="4" fill="#A78BFA" opacity="0.6"/>
  <circle cx="120" cy="550" r="2" fill="#FB923C" opacity="0.5"/>

  <!-- Petites étoiles 4 branches -->
  <g opacity="0.7">
    <path d="M 230 280 L 234 290 L 244 290 L 236 296 L 240 306 L 230 300 L 220 306 L 224 296 L 216 290 L 226 290 Z" fill="#FBBF24"/>
    <path d="M 820 600 L 823 607 L 830 607 L 824 611 L 827 618 L 820 614 L 813 618 L 816 611 L 810 607 L 817 607 Z" fill="#FBBF24" opacity="0.7"/>
  </g>

  <!-- Sol stylisé -->
  <ellipse cx="512" cy="900" rx="380" ry="35" fill="#1F1B2E" opacity="0.7"/>
  <ellipse cx="512" cy="900" rx="280" ry="20" fill="#0A0A0F" opacity="0.5"/>

  <!-- ===== PIERRE DU BAS (zen, yeux fermés) ===== -->
  <g>
    <ellipse cx="512" cy="800" rx="225" ry="115" fill="#0A0A0F" opacity="0.3"/>
    <ellipse cx="512" cy="785" rx="220" ry="115" fill="url(#stoneBottom)"/>
    <ellipse cx="430" cy="730" rx="70" ry="22" fill="white" opacity="0.25"/>
    <ellipse cx="395" cy="800" rx="28" ry="18" fill="#F472B6" opacity="0.45"/>
    <ellipse cx="629" cy="800" rx="28" ry="18" fill="#F472B6" opacity="0.45"/>
    <path d="M 440 775 Q 462 760 484 775" stroke="#1F1B2E" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 540 775 Q 562 760 584 775" stroke="#1F1B2E" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 480 815 Q 512 832 544 815" stroke="#1F1B2E" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ===== GOUTTE DE SUEUR (à côté de la pierre du bas) ===== -->
  <g transform="translate(720 720)">
    <!-- Forme goutte -->
    <path d="M 0 -30
             C -18 -10, -22 5, -22 18
             a 22 22 0 0 0 44 0
             C 22 5, 18 -10, 0 -30 Z"
          fill="url(#drop)"/>
    <!-- Highlight goutte -->
    <ellipse cx="-7" cy="5" rx="6" ry="10" fill="white" opacity="0.6"/>
    <!-- Petit rebond -->
    <circle cx="-30" cy="35" r="5" fill="url(#drop)" opacity="0.7"/>
    <circle cx="25" cy="40" r="4" fill="url(#drop)" opacity="0.6"/>
  </g>

  <!-- ===== PIERRE DU MILIEU (joyeuse) ===== -->
  <g>
    <ellipse cx="512" cy="555" rx="160" ry="88" fill="url(#stoneMid)"/>
    <ellipse cx="455" cy="510" rx="55" ry="16" fill="white" opacity="0.3"/>
    <ellipse cx="410" cy="570" rx="22" ry="14" fill="#F9A8D4" opacity="0.6"/>
    <ellipse cx="614" cy="570" rx="22" ry="14" fill="#F9A8D4" opacity="0.6"/>
    <ellipse cx="465" cy="545" rx="14" ry="16" fill="#1F1B2E"/>
    <ellipse cx="559" cy="545" rx="14" ry="16" fill="#1F1B2E"/>
    <circle cx="469" cy="540" r="5" fill="white"/>
    <circle cx="563" cy="540" r="5" fill="white"/>
    <circle cx="462" cy="552" r="2" fill="white"/>
    <circle cx="556" cy="552" r="2" fill="white"/>
    <path d="M 470 580 Q 512 605 554 580" stroke="#1F1B2E" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ===== HALTÈRE (à gauche de la pierre du milieu) ===== -->
  <g transform="translate(245 555) rotate(-15)">
    <!-- Barre centrale -->
    <rect x="-35" y="-8" width="70" height="16" rx="4" fill="#1F1B2E"/>
    <rect x="-35" y="-8" width="70" height="6" rx="3" fill="#374151"/>
    <!-- Poids gauche -->
    <rect x="-65" y="-26" width="22" height="52" rx="6" fill="url(#dumbbell)"/>
    <rect x="-65" y="-26" width="22" height="14" rx="6" fill="#FCD34D"/>
    <!-- Poids droit -->
    <rect x="43" y="-26" width="22" height="52" rx="6" fill="url(#dumbbell)"/>
    <rect x="43" y="-26" width="22" height="14" rx="6" fill="#FCD34D"/>
    <!-- Petit highlight -->
    <ellipse cx="-54" cy="-15" rx="6" ry="3" fill="white" opacity="0.6"/>
    <ellipse cx="54" cy="-15" rx="6" ry="3" fill="white" opacity="0.6"/>
  </g>

  <!-- Lignes de mouvement haltère -->
  <g stroke="#FBBF24" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <line x1="160" y1="500" x2="180" y2="495"/>
    <line x1="155" y1="525" x2="175" y2="525"/>
    <line x1="160" y1="550" x2="180" y2="555"/>
  </g>

  <!-- ===== PIERRE DU HAUT (excitée, yeux étoiles) ===== -->
  <g>
    <ellipse cx="512" cy="370" rx="115" ry="72" fill="url(#stoneTop)"/>
    <ellipse cx="475" cy="335" rx="40" ry="13" fill="white" opacity="0.35"/>
    <ellipse cx="430" cy="385" rx="18" ry="11" fill="#FCA5A5" opacity="0.6"/>
    <ellipse cx="594" cy="385" rx="18" ry="11" fill="#FCA5A5" opacity="0.6"/>
    <path d="M 470 365
             L 475 376 L 487 376 L 477 384
             L 481 396 L 470 388 L 459 396
             L 463 384 L 453 376 L 465 376 Z" fill="#1F1B2E"/>
    <path d="M 554 365
             L 559 376 L 571 376 L 561 384
             L 565 396 L 554 388 L 543 396
             L 547 384 L 537 376 L 549 376 Z" fill="#1F1B2E"/>
    <path d="M 488 405 Q 512 418 536 405" stroke="#1F1B2E" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ===== POMME (en haut à droite, près pierre du haut) ===== -->
  <g transform="translate(720 320)">
    <!-- Corps pomme -->
    <path d="M 0 0
             C -35 -5, -50 15, -48 40
             C -45 65, -25 80, -5 80
             L 5 80
             C 25 80, 45 65, 48 40
             C 50 15, 35 -5, 0 0 Z" fill="url(#apple)"/>
    <!-- Highlight -->
    <ellipse cx="-18" cy="20" rx="10" ry="14" fill="#FCA5A5" opacity="0.7"/>
    <!-- Tige -->
    <path d="M 0 0 Q 5 -12 12 -15" stroke="#78350F" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Feuille -->
    <ellipse cx="20" cy="-12" rx="14" ry="7" fill="#22C55E" transform="rotate(25 20 -12)"/>
    <ellipse cx="20" cy="-13" rx="10" ry="4" fill="#4ADE80" opacity="0.7" transform="rotate(25 20 -13)"/>
    <!-- Petite ombre dessous -->
    <ellipse cx="0" cy="85" rx="35" ry="6" fill="#0A0A0F" opacity="0.4"/>
  </g>

  <!-- ===== Étincelles autour de la pomme et du haut ===== -->
  <g opacity="0.85">
    <path d="M 380 305 L 384 315 L 394 315 L 386 321 L 390 331 L 380 325 L 370 331 L 374 321 L 366 315 L 376 315 Z" fill="#FBBF24"/>
    <g stroke="#FB923C" stroke-width="4" stroke-linecap="round">
      <line x1="380" y1="380" x2="386" y2="386"/>
      <line x1="386" y1="380" x2="380" y2="386"/>
    </g>
    <g stroke="#FBBF24" stroke-width="4" stroke-linecap="round">
      <line x1="640" y1="270" x2="646" y2="276"/>
      <line x1="646" y1="270" x2="640" y2="276"/>
    </g>
  </g>
</svg>
