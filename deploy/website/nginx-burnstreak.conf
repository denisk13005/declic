# Site burnstreak.com — à copier dans /etc/nginx/sites-available/burnstreak puis activer
# (voir deploy/website/README.md). Certificat HTTPS : Let's Encrypt (certbot), un seul
# certificat nommé « burnstreak.com » qui couvre les 6 adresses.
#
# Toutes les adresses (www, .fr, http) redirigent en 301 vers https://burnstreak.com :
# une seule adresse pour Google, pas de contenu en double.

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name burnstreak.com www.burnstreak.com burnstreak.fr www.burnstreak.fr burnstreak.app www.burnstreak.app;

    location /.well-known/acme-challenge/ {
        root /var/www/burnstreak/site;
    }

    location / {
        return 301 https://burnstreak.com$request_uri;
    }
}

# www et .fr → adresse principale
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.burnstreak.com burnstreak.fr www.burnstreak.fr burnstreak.app www.burnstreak.app;

    ssl_certificate     /etc/letsencrypt/live/burnstreak.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/burnstreak.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:burnstreak_ssl:10m;

    return 301 https://burnstreak.com$request_uri;
}

# Site principal
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name burnstreak.com;

    ssl_certificate     /etc/letsencrypt/live/burnstreak.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/burnstreak.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:burnstreak_ssl:10m;

    root /var/www/burnstreak/site;
    index index.html;
    charset utf-8;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/html text/css application/javascript application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Images : mises en cache 30 jours par les navigateurs
    location /img/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
